<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Logging Firewall</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Edge Logging Firewall</h1>
            <p>PII-redacted JSON telemetry powered by Llama 3.2 edge model</p>
        </header>
        <main class="split-view">
            <section class="input-section">
                <div class="section-header">
                    <h2>Raw Logs</h2>
                    <button id="process-btn" class="primary-btn">Distill Logs</button>
                </div>
                <textarea id="raw-log-input" placeholder="Paste raw, messy server logs here..."></textarea>
            </section>
            
            <section class="output-section">
                <div class="section-header">
                    <h2>Telemetry Output</h2>
                </div>
                <div class="output-container">
                    <pre><code id="json-output">// Clean JSON will appear here...</code></pre>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
